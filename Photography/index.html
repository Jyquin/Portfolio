<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Title</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <header>
            <h1 class="title">Photography Gallery</h1>
        </header>
        <nav id="navbar">
            <a href="#landscape">Landscapes</a>
            <a href="#portrait">Portraits</a>
            <a href="#abstract">Abstract</a>
            <a href="#about">About</a>
        </nav>
        
        <section class="ls-border"></section>

        <div id="landscape">
            <h2 class="title ls-title">Landscape Photos</h2>
            <figure class="ls1">
                <img
                    src="https://media.istockphoto.com/id/583809524/photo/alberta-wilderness-near-banff.webp?b=1&s=612x612&w=0&k=20&c=-7tro3UbbvFxXEXlOIZNH7i_C4QQ1LI3jTsPnfi2mNU="
                    alt="forest valley surrounded by mountains"
                    class="ls1" />
                <figcaption>Mountainous Landscape</figcaption>
            </figure>
            <figure class="ls2">
                <img
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT7XTyh2ofQyon3I5wqYtihnmJZ3QlPG2RYEcjGKpA3E6A4z92_TPxL06JM&s=10"
                    alt="sunflower field at sunset"
                    class="ls2" />
                <figcaption>Sunflower Fields</figcaption>
            </figure>
            <figure class="ls3">
                <img
                    src="https://images.unsplash.com/uploads/1412026095116d2b0c90e/3bf33993?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTB8fGxhbmRzY2FwZXN8ZW58MHx8MHx8fDA%3D"
                    alt="rolling green hills"
                    class="ls3" />
                <figcaption>Rolling Hills</figcaption>
            </figure>
            <figure class="ls4">
                <img
                    src="https://img.magnific.com/free-photo/beautiful-scenery-emerald-lake-yoho-national-park-british-columbia-canada_181624-6877.jpg?semt=ais_test_b&w=740&q=80"
                    alt="river running through a forest with a mountain in the distance"
                    class="ls4" />
                <figcaption>Tranquill River</figcaption>
            </figure>
        </div>
        
        <section class="p-border"></section>

        <div id="portrait">
            <h2 class="title p-title">Portrait Photos</h2>
            <figure class="p1">
                <img
                    src="https://t4.ftcdn.net/jpg/01/55/04/97/360_F_155049786_Ch17gRfPjmKG5N9S21VMs8LWBkjkfVDi.jpg"
                    alt="redheaded woman"
                    class="p1" />
                <figcaption>(Name Here)</figcaption>
            </figure>
            <figure class="p2">
                <img
                    src="https://t4.ftcdn.net/jpg/02/60/03/61/360_F_260036118_AUYppgsODQeTCnbu0OXGNDXB8EVzpxKq.jpg"
                    alt="woman with glasses"
                    class="p2" />
                <figcaption>(Name Here)</figcaption>
            </figure>
            <figure class="p3">
                <img
                    src="https://plus.unsplash.com/premium_photo-1682096252599-e8536cd97d2b?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NXx8cG9ydHJhaXR8ZW58MHx8MHx8fDA%3D"
                    alt="guy with glasses"
                    class="p3" />
                <figcaption>(Name Here)</figcaption>
            </figure>
            <figure class="p4">
                <img
                    src="https://images.stockcake.com/public/4/2/2/422fc816-8321-41bc-8769-f6a52fe94f55_large/professional-studio-portrait-stockcake.jpg"
                    alt="guy in a suit"
                    class="p4" />
                <figcaption>(Name Here)</figcaption>
            </figure>
        </div>
        
        <section class="a-border"></section>

        <div id="abstract">
            <h2 class="title a-title">Abstract Photos</h2>
            <figure class="a1">
                <img src="https://www.stockvault.net//data/2019/04/19/264047/thumb16.jpg"
                     alt="multicolored lines" 
                     class="a1"/>
                <figcaption>Sound Waves</figcaption>
            </figure>
            <figure class="a2">
                <img src="https://images.stockcake.com/public/1/8/f/18fd9a8f-5667-45d5-aa23-70352443e053_large/vibrant-abstract-art-stockcake.jpg"
                     alt="twisting colors" 
                     class="a2"/>
                <figcaption>Movement of Color</figcaption>
            </figure>
            <figure class="a3">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQh9UR9ZjqRQIoAJkSGxdc1VrJIQFQorwnEwA3TvoFyUv0VdDIiAVDagLA&s=10"
                     alt="splatter painting" 
                     class="a3"/>
                <figcaption>Splatter Painting</figcaption>
            </figure>
            <figure class="a4">
                <img src="https://thumbs.dreamstime.com/b/vibrant-abstract-wallpaper-stunning-design-modern-d-cor-high-res-artistic-backgrounds-patterns-elevate-your-digital-space-298693361.jpg"
                     alt="blobs of paint"
                     class="a4">
                <figcaption>Mixing Paint</figcaption>
            </figure>
        </div>

        </footer>
    </body>
</html>
